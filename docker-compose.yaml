services:
    mongodb:
        image: mongo:latest
        hostname: mongodb
        restart: unless-stopped
        env_file: .env
        mem_limit: 8g
        cpus: 2
        # Publish to host loopback only so the on-host snapsec-agent can
        # reach mongo without exposing it to the public internet.
        ports:
            - "127.0.0.1:27017:27017"
        volumes:
            - mongodb_data:/data/db
            - ./mongo-init:/docker-entrypoint-initdb.d
            - ./configs/mongo-keyfile:/tmp/mongo-keyfile:ro
        environment:
            - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USER}
            - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASS}
        command:
            - bash
            - -c
            - |
                mkdir -p /etc/mongo
                cp /tmp/mongo-keyfile /etc/mongo/keyfile
                chown mongodb:mongodb /etc/mongo/keyfile
                chmod 400 /etc/mongo/keyfile
                exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /etc/mongo/keyfile --bind_ip_all
        healthcheck:
            test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/27017"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s
        networks:
            - snapsec_network_prod

    redis:
        image: redis:alpine
        restart: unless-stopped
        command: redis-server --replica-read-only no
        mem_limit: 2g
        cpus: 2
        volumes:
            - redis_data:/data
        environment:
            - REDIS_PASSWORD=${REDIS_PASS}
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
            interval: 30s
            timeout: 5s
            retries: 3
        networks:
            - snapsec_network_prod
    
    migration-service:
        image: ghcr.io/faizanalibhat/migration-service:master
        restart: unless-stopped
        env_file: .env
        mem_limit: 2g
        cpus: 2
        volumes:
            - ./keys:/app/keys
            - snapsec_data:/data
        depends_on:
            - mongodb
        networks:
            - snapsec_network_prod


    mcp-service:
        image: ghcr.io/faizanalibhat/mcp-service:master
        restart: unless-stopped
        env_file: .env
        mem_limit: 2g
        cpus: 2
        volumes:
            - ./keys:/app/keys
            - snapsec_data:/data
        depends_on:
            - mongodb
            - vm
        networks:
            - snapsec_network_prod

    ui:
        image: ghcr.io/faizanalibhat/ui:master
        restart: unless-stopped
        mem_limit: 2g
        cpus: 2
        ports:
            - "80:80"
        env_file: .env
        networks:
            - snapsec_network_prod
        depends_on:
            - auth
            - vm
            - apisec
            - op
            - tm
            - vs
            - util
            - asset-inventory
            - cmdexec
            - notify
            - vscanner

    auth:
        image: ghcr.io/faizanalibhat/auth:master
        restart: unless-stopped
        env_file: .env
        mem_limit: 2g
        cpus: 2
        volumes:
            - ./keys:/app/keys
            - snapsec_data:/data
        depends_on:
            - mongodb
        networks:
            - snapsec_network_prod

    vs:
        image: ghcr.io/faizanalibhat/vs:master
        restart: unless-stopped
        env_file: .env
        mem_limit: 2g
        cpus: 2
        volumes:
            - ./keys:/app/keys
            - snapsec_data:/data
        depends_on:
            - mongodb
        networks:
            - snapsec_network_prod

    apisec:
        image: ghcr.io/faizanalibhat/apisec:master
        restart: unless-stopped
        env_file: .env
        mem_limit: 4g
        cpus: 3
        volumes:
            - ./keys:/app/keys
            - snapsec_data:/data
        depends_on:
            - mongodb
        networks:
            - snapsec_network_prod

    asset-inventory:
        image: ghcr.io/faizanalibhat/asset-inventory:master
        restart: unless-stopped
        env_file: .env
        mem_limit: 2g
        cpus: 2
        volumes:
            - ./keys:/app/keys
            - snapsec_data:/data
        depends_on:
            - mongodb
        networks:
            - snapsec_network_prod

    vscanner:
        image: ghcr.io/faizanalibhat/vscanner:master
        restart: unless-stopped
        env_file: .env
        mem_limit: 6g
        cpus: 3
        volumes:
            - ./keys:/app/keys
            - snapsec_data:/data
        depends_on:
            - mongodb
        networks:
            - snapsec_network_prod

    cmdexec:
        image: ghcr.io/faizanalibhat/cmdexec:master
        restart: unless-stopped
        mem_limit: 3g
        cpus: 2
        env_file: .env
        volumes:
            - ./keys:/app/keys
            - snapsec_data:/data
        depends_on:
            - mongodb
        networks:
            - snapsec_network_prod

    rabbitmq:
        image: rabbitmq:3-management
        container_name: rabbitmq
        restart: unless-stopped
        mem_limit: 3g
        cpus: 2
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        networks:
            - snapsec_network_prod

    risk-register:
        image: ghcr.io/faizanalibhat/risk-register:master
        restart: unless-stopped
        env_file: .env
        mem_limit: 2g
        cpus: 2
        volumes:
            - ./keys:/app/keys
            - snapsec_data:/data
        depends_on:
            - mongodb
        networks:
            - snapsec_network_prod

    notify:
        image: ghcr.io/faizanalibhat/notify:master
        restart: unless-stopped
        env_file: .env
        mem_limit: 2g
        cpus: 2
        volumes:
            - ./keys:/app/keys
            - snapsec_data:/data
        depends_on:
            - mongodb
        networks:
            - snapsec_network_prod

    op:
        image: ghcr.io/faizanalibhat/op:master
        restart: unless-stopped
        env_file: .env
        mem_limit: 2g
        cpus: 2
        volumes:
            - "./keys:/app/keys"
            - "snapsec_data:/data"
        depends_on:
            - mongodb
        networks:
            - snapsec_network_prod

    util:
        image: ghcr.io/faizanalibhat/util:master
        restart: unless-stopped
        env_file: .env
        mem_limit: 2g
        cpus: 2
        volumes:
            - ./keys:/app/keys
            - snapsec_data:/data
        depends_on:
            - mongodb
        networks:
            - snapsec_network_prod

    tm:
        image: ghcr.io/faizanalibhat/tm:master
        restart: unless-stopped
        env_file: .env
        mem_limit: 2g
        cpus: 2
        volumes:
            - ./keys:/app/keys
            - snapsec_data:/data
        depends_on:
            - mongodb
        networks:
            - snapsec_network_prod

    vm:
        image: ghcr.io/faizanalibhat/vm:master
        restart: unless-stopped
        env_file: .env
        mem_limit: 4g
        cpus: 3
        volumes:
            - ./keys:/app/keys
            - snapsec_data:/data
        depends_on:
            - mongodb
            - redis
        networks:
            - snapsec_network_prod

    gotenberg:
        image: gotenberg/gotenberg:8.30.0
        restart: unless-stopped
        env_file: .env
        mem_limit: 2g
        cpus: 2
        environment:
            API_TIMEOUT: "600s"
            CHROMIUM_TIMEOUT: "600s"
            CHROMIUM_WAIT_DELAY: "15000"
            CHROMIUM_WAIT_FOR_NAVIGATION: "true"

            # disable url validation
            API_DISABLE_URL_VALIDATION: "true"
        networks:
            - snapsec_network_prod

    otel-agent:
        image: otel/opentelemetry-collector-contrib:0.130.1
        restart: unless-stopped

        mem_limit: 2g
        cpus: 2

        # Run as root (same as --user 0:0)
        user: "0:0"

        # Same as --pid host
        pid: host

        volumes:
            # Host filesystem (for hostmetrics, process, etc.)
            - /proc:/hostfs/proc:ro
            - /sys:/hostfs/sys:ro
            - /:/hostfs:ro

            # Collector config
            - ./configs/otel-agent-config.yaml:/etc/otelcol-contrib/config.yaml:ro

        environment:
            HOST_PROC: /hostfs/proc
            HOST_SYS: /hostfs/sys
            HOST_ROOT: /hostfs

        command:
            - "--config=/etc/otelcol-contrib/config.yaml"

        networks:
            - snapsec_network_prod


    automation-service:
        image: ghcr.io/faizanalibhat/automation-service:master
        restart: unless-stopped
        env_file: .env
        mem_limit: 4g
        cpus: 3
        volumes:
            - ./keys:/app/keys
            - snapsec_data:/data
        depends_on:
            - mongodb
            - redis
        networks:
            - snapsec_network_prod


volumes:
    mongodb_data:
    redis_data:
    rabbitmq_data:
    snapsec_data:

networks:
    snapsec_network_prod:
